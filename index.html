<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090b10">
<title>GRAPH — Bitcoin</title>
<style>
:root{color-scheme:dark;--bg:#090b10;--panel:#121722;--line:#252e3c;--muted:#91a0b5;--green:#35d39a;--red:#ff555d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#202b3d 0,transparent 48%),var(--bg);color:#f3f6fb;font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
main{max-width:900px;margin:auto;padding:22px 0 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-size:25px;font-weight:900;letter-spacing:3px}.brand span{color:var(--green)}.sub,.muted{font-size:11px;color:var(--muted);letter-spacing:1px}.pill{border:1px solid var(--line);border-radius:30px;padding:7px 10px;font-size:11px;color:var(--muted)}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#f4c96b;margin-right:6px}.dot.live{background:var(--green);box-shadow:0 0 9px var(--green)}.panel{background:linear-gradient(145deg,#151d2a,#10151e);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0;box-shadow:0 12px 35px #0003}.price{font-size:clamp(34px,8vw,54px);font-weight:850;letter-spacing:-2px;margin:8px 0}.change{font-size:14px;font-weight:700}.charthead{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:7px;margin:15px 0}.tab{background:#0d121a;border:1px solid #34445b;color:#cbd5e1;padding:8px 13px;border-radius:9px;font-weight:650}.tab.active{background:#244235;border-color:#35d39a;color:#8df0c7}canvas{width:100%;height:340px;display:block}.status{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}.foot{font-size:11px;color:#748196;line-height:1.5;margin:16px 3px}
</style>
</head>
<body>
<main>
<header class="top"><div><div class="brand">GR<span>A</span>PH</div><div class="sub">BITCOIN · BTC/USD</div></div><div class="pill"><i id="dot" class="dot"></i><span id="connection">CONNECTING</span></div></header>
<section class="panel">
 <div class="muted">BITCOIN LIVE PRICE</div>
 <div id="price" class="price">Loading BTC…</div>
 <div><span id="change" class="change">Getting market data</span></div>
</section>
<section class="panel">
 <div class="charthead"><div><div style="font-weight:750;font-size:17px">BTC price chart</div><div class="muted">Live Bitcoin / US Dollar</div></div><div class="pill" id="lastupdate">Waiting</div></div>
 <div class="tabs"><button class="tab active" data-period="1">1M</button><button class="tab" data-period="5">5M</button><button class="tab" data-period="15">15M</button><button class="tab" data-period="60">1H</button></div>
 <canvas id="chart" width="1000" height="520" aria-label="Bitcoin price candlestick chart"></canvas>
 <div id="status" class="status">Connecting to live BTC price data…</div>
</section>
<div class="foot">Live BTC/USD market chart. Price data is for information only and is not a trading recommendation.</div>
</main>
<script>
const $=id=>document.getElementById(id);
let candles=[],period=1,loading=false,lastPrice=null;
const fmt=n=>'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
async function get(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw Error('Price feed returned HTTP '+r.status);return r.json()}
function draw(){
 const c=$('chart'),ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);
 const left=78,right=18,top=22,bottom=h-35,pw=w-left-right,ph=bottom-top;
 ctx.strokeStyle='#283344';ctx.lineWidth=1;ctx.fillStyle='#91a0b5';ctx.font='16px system-ui';
 if(!candles.length){for(let i=0;i<5;i++){let y=top+i*ph/4;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(w-right,y);ctx.stroke()}ctx.fillText('WAITING FOR BTC PRICE DATA…',left+18,h/2);return}
 const lows=candles.map(x=>x[3]),highs=candles.map(x=>x[2]);let lo=Math.min(...lows),hi=Math.max(...highs),pad=Math.max((hi-lo)*.12,1);lo-=pad;hi+=pad;
 const y=v=>top+(hi-v)/(hi-lo)*ph,x=i=>left+(i+.5)*pw/candles.length,step=pw/candles.length,bw=Math.max(2,Math.min(13,step*.62));
 for(let i=0;i<5;i++){let yy=top+i*ph/4,val=hi-i*(hi-lo)/4;ctx.beginPath();ctx.moveTo(left,yy);ctx.lineTo(w-right,yy);ctx.stroke();ctx.fillText('$'+val.toLocaleString('en-US',{maximumFractionDigits:0}),4,yy+5)}
 candles.forEach((b,i)=>{const [t,o,high,low,close]=b,up=close>=o;ctx.strokeStyle=up?'#35d39a':'#ff555d';ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=2;let xx=x(i),yo=y(o),yc=y(close);ctx.beginPath();ctx.moveTo(xx,y(high));ctx.lineTo(xx,y(low));ctx.stroke();ctx.fillRect(xx-bw/2,Math.min(yo,yc),bw,Math.max(2,Math.abs(yc-yo)))});
 const latest=candles[candles.length-1][4];ctx.fillStyle='#35d39a';ctx.font='bold 17px system-ui';ctx.fillText(fmt(latest),left+5,top+18);
}
async function refresh(){
 if(loading)return;loading=true;
 try{
  const [ticker,raw]=await Promise.all([
   get('https://api.exchange.coinbase.com/products/BTC-USD/ticker'),
   get('https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity='+period*60)
  ]);
  const p=Number(ticker.price),open=Number(ticker.open_24h||0),pct=open?(p-open)/open*100:0;
  $('price').textContent=fmt(p);$('change').textContent=(pct>=0?'+':'')+pct.toFixed(2)+'% today';$('change').style.color=pct>=0?'#35d39a':'#ff555d';
  candles=raw.slice().reverse().map(a=>[a[0]*1000,a[3],a[2],a[1],a[4]]).filter(a=>a.every(Number.isFinite));
  if(!candles.length)throw Error('BTC candles have not loaded yet.');
  $('dot').classList.add('live');$('connection').textContent='LIVE';$('lastupdate').textContent=new Date().toLocaleTimeString();$('status').textContent='BTC/USD · Coinbase market data · '+candles.length+' candles · refreshes automatically';draw();lastPrice=p;
 }catch(e){$('dot').classList.remove('live');$('connection').textContent='DATA ISSUE';$('status').textContent='Could not load live BTC chart: '+e.message+' — tap refresh by reloading the page.';draw()}
 finally{loading=false}
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');period=Number(b.dataset.period);refresh()}));
refresh();setInterval(refresh,10000);
</script>
</body>
</html>
